name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show the toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: scripts/bundle.sh
      - name: Lint the shell scripts
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh install.sh
